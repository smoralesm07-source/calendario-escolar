name: Sincronizar evaluaciones

on:
  workflow_dispatch:
  schedule:
    - cron: '15 10 * * *'
  push:
    paths:
      - 'scripts/**'
      - 'config/**'
      - '.github/workflows/sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install requests openpyxl

      - name: Extraer 3°D y 6°B
        run: python scripts/sync_evaluaciones.py

      - name: Guardar cambios
        run: |
          if git diff --quiet data/evaluaciones.json; then
            echo "Sin cambios en evaluaciones."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/evaluaciones.json
          git commit -m "Actualizar evaluaciones 3D y 6B"
          git push
